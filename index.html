<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Пепельные земли</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500;700&display=swap">
<style>
/* Тёмный пергамент: чёрный фон, золото для действий, фиолет для Тьмы. Всё на токенах. */
:root{color-scheme:dark;--bg:#0b090f;--card:#17121f;--card2:#211a2b;--line:#3a2f48;--acc:#d9a84e;--acc2:#a9792a;--txt:#ebe5f2;--mut:#9a90aa;--red:#c2412d;--pur:#8e5bd0;--grn:#4caf72;
--common:#9a93a8;--rare:#5aa9e6;--epic:#b574f0;--legendary:#f0b84a;--head:'Cinzel',Georgia,serif;--body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(ellipse at top,#1d1429 0%,var(--bg) 62%);color:var(--txt);font:15px/1.45 var(--body);min-height:100vh}
#embers{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#vig{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;transition:opacity .8s;background:radial-gradient(ellipse at center,transparent 42%,rgba(52,6,98,.7) 100%)}
#flash{position:fixed;inset:0;pointer-events:none;z-index:80;opacity:0}
#flash.go{animation:flash .55s ease-out}
@keyframes flash{0%{opacity:.5}100%{opacity:0}}
#app{position:relative;z-index:2;max-width:520px;margin:0 auto;padding-block:14px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--head);font-weight:800;letter-spacing:.16em;color:var(--acc);text-align:center;margin:10px 0 2px;font-size:27px;text-shadow:0 0 22px rgba(217,168,78,.35)}
h2{font-family:var(--head);color:var(--acc);margin:0 0 10px;font-size:20px;letter-spacing:.06em}
h3{margin:0 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700}
.sub{text-align:center;color:var(--mut);margin:0 0 14px;font-size:13px}
section,.card{background:linear-gradient(180deg,#1b1625,#15111c);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:0 8px 22px rgba(0,0,0,.35)}
.chip{display:inline-block;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card2);margin:3px 4px 3px 0;cursor:pointer;user-select:none;transition:transform .08s,border-color .15s}
.chip:active{transform:scale(.96)}
.chip.sel{border-color:var(--acc);background:#3a2c18;color:var(--acc);box-shadow:0 0 12px rgba(217,168,78,.25)}
.chip.dis{opacity:.4}
.hint{color:var(--mut);font-size:13px;margin-top:6px}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:linear-gradient(180deg,#e6b75c,var(--acc2));color:#1a1208;font:700 16px var(--body);cursor:pointer;margin-top:8px;box-shadow:0 4px 14px rgba(217,168,78,.22),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .08s,filter .15s}
.btn:active{transform:scale(.98);filter:brightness(.92)}
.btn.alt{background:var(--card2);color:var(--txt);border:1px solid var(--line);box-shadow:none}
.btn.red{background:linear-gradient(180deg,#d9573f,#962d1d);color:#fff}
.btn.pur{background:linear-gradient(180deg,#a374e0,#6b3fb0);color:#fff}
.btn.grn{background:linear-gradient(180deg,#5fc487,#2f8350);color:#fff}
.tip{position:fixed;left:0;right:0;margin:0 auto;width:max-content;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translateY(30px);max-width:min(calc(100vw - 32px),420px);box-sizing:border-box;background:#2a1d3a;color:#fff;border:1px solid var(--acc);padding:12px 16px;border-radius:12px;font-size:14px;line-height:1.4;box-shadow:0 8px 30px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.25s;z-index:999;text-align:center}
.tip.show{opacity:1;transform:translateY(0)}
.miss{margin-top:12px;padding:10px 12px;border-radius:10px;background:rgba(217,168,78,.12);border:1px dashed var(--acc);font-size:14px;line-height:1.45}
section.warn{animation:warn 1.4s;border-radius:12px}
@keyframes warn{0%,60%{box-shadow:0 0 0 2px #e0553f,0 0 18px rgba(224,85,63,.6)}100%{box-shadow:0 0 0 0 transparent}}
.pulse{animation:pls 1.2s infinite}
@keyframes pls{50%{box-shadow:0 0 0 3px rgba(217,168,78,.6)}}
.comp{display:flex;gap:10px;align-items:center;margin:8px 0;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.comp .ci{font-size:28px}
.mini{flex:0 0 auto;background:transparent;border:1px solid rgba(255,255,255,.25);color:inherit;border-radius:8px;padding:5px 9px;font-size:12px}
.rbar{position:relative;height:6px;border-radius:3px;margin:4px 0 6px;background:linear-gradient(90deg,#8a2a2a,#555 50%,#d9a84e)}
.rbar i{position:absolute;top:-3px;width:4px;height:12px;border-radius:2px;background:#fff;transform:translateX(-2px)}
.intent{margin-top:8px;padding:9px 11px;border-radius:10px;background:rgba(224,85,63,.12);border:1px solid rgba(224,85,63,.5)}
.intent b{font-size:14px}
.stcs{margin-top:6px}
.stc{display:inline-block;margin:2px 4px 2px 0;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.08);font-size:12px}
.wkrow{margin-top:6px;line-height:1.5}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.btn small{display:block;font-weight:500;opacity:.85;font-size:12px}
.row{display:flex;gap:8px}.row .btn{margin-top:8px}
input[type=text]{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:16px;font-family:var(--body)}
.stat{display:flex;align-items:center;justify-content:space-between;padding:5px 0;gap:8px}
.stat b{min-width:28px;text-align:center}
.step{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:18px;cursor:pointer}
.bar{height:8px;background:#2a2234;border-radius:5px;overflow:hidden;margin:3px 0 6px}
.bar i{display:block;height:100%;border-radius:5px;transition:width .4s}
.hp{background:linear-gradient(90deg,#8e2a1d,#e0553f)}.dk{background:linear-gradient(90deg,#5a2f98,#b07cff)}.en{background:linear-gradient(90deg,#8a6120,#e0a845)}.gl{background:linear-gradient(90deg,#8a6120,#f0c35a)}
.hero{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);gap:8px}
.hero:last-child{border:0}
.small{font-size:12px;color:var(--mut)}
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.topbar .ttl{font:800 15px var(--head);letter-spacing:.14em;color:var(--acc);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:10px;padding:8px 11px;font:600 14px var(--body);cursor:pointer;position:relative}
.ibtn .dot{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;border-radius:9px;font-size:10px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 4px;animation:pop 1.2s infinite}
@keyframes pop{50%{transform:scale(1.18)}}
.obj{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:#1a1424;margin-bottom:10px;font-size:13px}
.obj b{color:var(--acc)}
.obj .g{flex:1;min-width:0}
.strip{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.pill{flex:0 0 auto;min-width:104px;padding:6px 9px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:12px}
.pill.cur{border-color:var(--acc);box-shadow:0 0 12px rgba(217,168,78,.3)}.pill.out{opacity:.4}
.pill .bar{height:5px;margin:4px 0 0}
.board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:3px;aspect-ratio:1;margin-bottom:12px}
.cell{--g:#2a2236;background:linear-gradient(160deg,#241c30,#171220);border:1px solid var(--line);border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;font-size:17px;min-width:0;box-shadow:inset 0 0 12px var(--g)}
.t-village{--g:#2f6a45}.t-ambush{--g:#7a2a22}.t-altar{--g:#59309a}.t-treasure{--g:#8a6a20}.t-crypt{--g:#3a3a56}.t-forest{--g:#1f4a2c}.t-swamp{--g:#3b5a35}.t-mage{--g:#2a4a9a}.t-caravan{--g:#9a6a2a}.t-trader{--g:#7a5a3a}.t-thief{--g:#4a4a4a}.t-smith{--g:#8a3a1a}.t-camp{--g:#a0521e}.t-shrine{--g:#6a7aa0}.t-lair{--g:#b02020;border-color:var(--red);animation:lair 2s infinite}
@keyframes lair{50%{box-shadow:inset 0 0 18px #b02020,0 0 14px rgba(176,32,32,.6)}}
.cell.cur{outline:2px solid var(--acc);outline-offset:-1px;animation:cellp 1.3s infinite;z-index:2}
@keyframes cellp{50%{box-shadow:inset 0 0 14px var(--g),0 0 14px rgba(217,168,78,.7)}}
.cell.fresh{animation:fresh 1.4s ease-out;z-index:3}
@keyframes fresh{0%{transform:scale(.4);opacity:0}40%{transform:scale(1.3);box-shadow:0 0 22px 6px rgba(240,184,74,.9)}100%{transform:scale(1)}}
.cell.fresh::after{content:'✨';position:absolute;top:-6px;right:-4px;font-size:13px;animation:fl2 1.4s ease-out forwards}
@keyframes fl2{to{opacity:0;transform:translateY(-10px)}}
.cell.clr{animation:clr .9s ease-out}
@keyframes clr{0%{filter:brightness(2.2)}100%{filter:none}}
.toks{display:flex;flex-wrap:wrap;justify-content:center;gap:1px;position:absolute;bottom:1px;left:0;right:0}
.tok{width:16px;height:16px;border-radius:50%;font-size:9px;font-style:normal;font-weight:700;color:#111;display:flex;align-items:center;justify-content:center;border:1.5px solid #000;box-shadow:0 0 6px rgba(0,0,0,.6)}
.tok.hop{animation:hop .35s}
@keyframes hop{40%{transform:translateY(-9px) scale(1.25)}}
.center{grid-row:2/8;grid-column:2/8;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;background:radial-gradient(circle,#2a1d3a,#0d0a12);border:1px solid var(--line);border-radius:14px}
.die{font:800 44px/1 var(--head);color:var(--acc);text-shadow:0 0 16px rgba(217,168,78,.4)}
.center .t{font-size:12px;color:var(--mut);margin-top:2px}
.center .g{font-size:12px;margin-top:6px;color:var(--txt)}
.center .tn{font:600 14px var(--head);margin-top:8px;color:var(--txt)}
.coach{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:linear-gradient(90deg,rgba(217,168,78,.16),rgba(217,168,78,.04));border:1px solid rgba(217,168,78,.35);margin-bottom:8px}
.coach .ic{font-size:26px;line-height:1}
.coach b{display:block;color:var(--acc);font-size:14px}
.coach span{font-size:13px;color:#d8d0e4}
.scene{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;margin-bottom:8px;background:linear-gradient(120deg,var(--g,#2a2236),#150f1c)}
.scene .em{font-size:44px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))}
.scene b{font-family:var(--head);font-size:15px}
.scene div div{font-size:13px;color:#d8d0e4}
.foe{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;background:linear-gradient(120deg,#3a1613,#150f1c);margin-bottom:6px}
.foe .em{font-size:54px;animation:idle 2.4s ease-in-out infinite;filter:drop-shadow(0 4px 10px rgba(0,0,0,.7))}
@keyframes idle{50%{transform:translateY(-4px)}}
.foe .in{flex:1;min-width:0}
.foe b{font-family:var(--head)}
.opt{display:block;width:100%;text-align:left;padding:11px 12px;margin-top:8px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(180deg,#251d33,#1a1424);color:var(--txt);cursor:pointer;font:600 15px var(--body);transition:transform .08s,border-color .15s}
.opt:active{transform:scale(.98);border-color:var(--acc)}
.opt small{display:flex;justify-content:space-between;gap:8px;font-weight:500;color:var(--mut);font-size:12px;margin-top:3px}
.opt .pc{font-weight:800;white-space:nowrap}
.narr{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:15px;line-height:1.5;color:#e4dccb;padding:10px 12px;margin-bottom:8px;border-left:3px solid var(--acc);background:rgba(255,255,255,.04);border-radius:0 10px 10px 0}
.narr.big{font-size:16px;margin:10px 0}
.story{font-family:Georgia,'Times New Roman',serif;font-size:14.5px!important;line-height:1.5;color:#e9e1d2!important}
.ce{font-size:13px;line-height:1.45;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.07);font-family:Georgia,serif;color:#d8d0e4}
.ce span{display:block;font-family:inherit;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin-bottom:2px}
.bgc{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.fate{font-family:Georgia,serif;font-style:italic;font-size:13.5px;color:#d8d0e4;margin:-4px 0 10px;padding:0 4px}
.chronbox{max-height:340px;overflow:auto}
.res{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--card2)}
.res.ok{border-left:3px solid var(--grn)}.res.bad{border-left:3px solid var(--red)}
.omen{display:flex;gap:10px;align-items:center;padding:7px 12px;border-radius:12px;background:rgba(142,91,208,.12);border:1px solid rgba(142,91,208,.4);margin:-4px 0 10px;font-size:12px;color:#d8d0e4}
.omen b{color:#c9a8ff}

.qinv{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:6px}
.qinv.eq{grid-template-columns:repeat(5,1fr);margin-bottom:4px}
.setbox{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:12px;background:#120d18}
.setbox .on{color:#9be3b0}.setbox .off{color:var(--mut)}
.slot{aspect-ratio:1;border-radius:9px;border:1.5px dashed #3a2f48;background:#150f1c;display:flex;align-items:center;justify-content:center;font-size:21px;position:relative;cursor:pointer;min-width:0}
.slot.full{border-style:solid;background:linear-gradient(160deg,#241c30,#161019)}
.slot.sel{outline:2px solid var(--acc);outline-offset:1px}
.slot .nw{position:absolute;top:-5px;right:-3px;background:var(--red);color:#fff;font-size:8px;font-weight:800;border-radius:6px;padding:1px 4px;animation:pop 1.2s infinite}
.slot .lb{position:absolute;bottom:1px;left:0;right:0;text-align:center;font-size:8px;color:var(--mut);letter-spacing:.04em}
.eq .slot{aspect-ratio:auto;height:62px;flex-direction:column;font-size:24px}
.r-common{border-color:var(--common)!important}.r-rare{border-color:var(--rare)!important;box-shadow:0 0 8px rgba(90,169,230,.35)}.r-epic{border-color:var(--epic)!important;box-shadow:0 0 10px rgba(181,116,240,.45)}.r-legendary{border-color:var(--legendary)!important;box-shadow:0 0 14px rgba(240,184,74,.6)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px;border:1px solid currentColor}
.tc-common{color:var(--common)}.tc-rare{color:var(--rare)}.tc-epic{color:var(--epic)}.tc-legendary{color:var(--legendary)}
.log{font-size:13px;color:#cfc6dc}.log div{padding:3px 0;border-bottom:1px solid #251e30}
.log div:first-child{color:#fff}
.big{font-size:46px;text-align:center}
.modal{position:fixed;inset:0;z-index:60;background:rgba(5,3,9,.78);display:flex;align-items:flex-end;justify-content:center}
.modal.anim{animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:520px;max-height:90vh;overflow-y:auto;background:linear-gradient(180deg,#1d1727,#130e19);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px))}
.modal.anim .sheet{animation:slide .25s ease-out}
@keyframes slide{from{transform:translateY(40px);opacity:0}}
.sheet .x{float:right;border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:9px;width:34px;height:34px;font-size:16px;cursor:pointer}
.bag{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bag .slot{font-size:30px}
.det{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:12px;background:#120d18}
.det b{font-family:var(--head);font-size:16px}
.steps{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.steps .n{flex:0 0 28px;height:28px;border-radius:50%;background:#3a2c18;color:var(--acc);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:12px}
.leg div{display:flex;gap:6px;align-items:flex-start}
.leg i{font-style:normal;font-size:18px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:90}
.float{position:fixed;font:800 26px var(--head);text-shadow:0 2px 8px #000;animation:fl 1.15s ease-out forwards;pointer-events:none;white-space:nowrap}
.float.dmg{color:#ff6a58}.float.heal{color:#74e8a2}.float.gold{color:#f4c654}.float.dark{color:#bb92ff}.float.hit{color:#ffd37a;font-size:32px}
@keyframes fl{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-200%) scale(1)}}
.shake{animation:shake .42s}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.dice-ov{position:fixed;inset:0;background:rgba(5,3,9,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:auto;animation:fade .15s}
.dice-ov.out{opacity:0;transition:opacity .2s}
.dice-lbl{font:600 15px var(--head);color:var(--txt);text-align:center;max-width:80%;letter-spacing:.04em}
.die-wrap{width:160px;height:160px;display:flex;align-items:center;justify-content:center}
.die-wrap.crit{filter:drop-shadow(0 0 22px #f0b84a)}.die-wrap.fumble{filter:drop-shadow(0 0 22px #c2412d)}
.die-shape{width:132px;height:132px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#f6dc94,#b88a35);color:#1a1208;font:800 56px var(--head)}
.die-shape.d20{clip-path:polygon(50% 0,95% 25%,95% 75%,50% 100%,5% 75%,5% 25%)}
.die-shape.d6{border-radius:24px}
.die-shape.roll{animation:spin .4s linear infinite}
.die-shape.land{animation:land .45s ease-out}
.die-wrap.fumble .die-shape{background:linear-gradient(145deg,#e07a6c,#8a2a1f);color:#fff}
.die-wrap.crit .die-shape{background:linear-gradient(145deg,#fff4c4,#f0b84a)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes land{0%{transform:scale(1.5)}60%{transform:scale(.92)}100%{transform:scale(1)}}
.dice-res{font:800 18px var(--head);color:var(--acc);min-height:24px;letter-spacing:.08em}
.banner{position:fixed;left:0;right:0;top:34%;text-align:center;animation:ban 1.5s ease-out forwards;pointer-events:none}
.banner b{display:block;font:800 40px var(--head);letter-spacing:.14em;color:#fff;text-shadow:0 0 24px var(--red),0 3px 10px #000}
.banner span{font-size:15px;color:#ffd9d2}
@keyframes ban{0%{opacity:0;transform:scale(1.5)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:14px;background:#17121f;border:2px solid var(--common);animation:toast 2.4s ease-out forwards;pointer-events:none;max-width:88vw}
.toast i{font-style:normal;font-size:32px}
.toast small{display:block;color:var(--mut);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.toast b{font-family:var(--head)}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-20px) scale(.9)}12%{opacity:1;transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}

const CONS = Object.keys(ITEMS).filter(id => ITEMS[id].type === 'use');
function randCons() {
  const t = Math.random(), r = t < 0.6 ? 'common' : t < 0.92 ? 'rare' : 'epic';
  const l = CONS.filter(id => ITEMS[id].rarity === r);
  return pick(l.length ? l : CONS);

function rollGear(w) {
  let t = Math.random() * 100, r = 'common';
  for (const [k, v] of w) { t -= v; if (t < 0) { r = k; break; } }
  return pick(LOOTBY[r]);
}
function rollLoot(rich) {
  if (Math.random() < (rich ? 0.6 : 0.25)) return rollGear(rich ? [['common', 20], ['rare', 46], ['epic', 26], ['legendary', 8]] : [['common', 55], ['rare', 33], ['epic', 10], ['legendary', 2]]);
  return randCons();
}
function itemStats(it) {
  if (it.type !== 'equip') return it.d;
  const a = [];
  if (it.slot === 'weapon') a.push('d' + it.die + ' · ' + STATN[it.stat] + (it.hit ? ' · попадание ' + (it.hit > 0 ? '+' : '') + it.hit : ''));
  if (it.dmg) a.push('урон +' + it.dmg);
  if (it.ac) a.push('защита +' + it.ac);
  if (it.mhp) a.push('здоровье +' + it.mhp);
  if (it.roll) a.push('+' + it.roll + ' ко всем броскам d20');
  if (it.crit) a.push('крит с ' + (20 - it.crit));
  if (it.dodge) a.push('уклонение ' + it.dodge + '%');
  if (it.vamp) a.push('лечит ' + it.vamp + ' HP за попадание');
  if (it.regen) a.push('+' + it.regen + ' HP в начале хода');
  if (it.ward) a.push('Тьма растёт на ' + it.ward + ' меньше');

}

  for (const s of SLOTS) { const id = p.eq[s]; if (id && ITEMS[id][k]) a += ITEMS[id][k]; }
  for (const sid in SETS) { const c = setCount(p, sid); if (c < 2) continue; for (const t in SETS[sid].tiers) if (c >= +t && SETS[sid].tiers[t][k]) a += SETS[sid].tiers[t][k]; }
  return a;
}

function priceOf(id) { const v = basePrice(id); return G.omen === 'caravan' ? Math.max(1, Math.round(v * 0.6)) : v; }

/* Рассказчик */
function narr(t) { G.narr = t; }
function narrAdd(t) { G.narr = (G.narr ? G.narr + ' ' : '') + t; }
function chron(t) { G.chron.push({ r: G.round, t }); if (G.chron.length > 300) G.chron.shift(); }
function pickEvent(t) {
  let pool = EVENTS.filter(e => (!e.comp || canMeet(e.comp)) && (e.tile ? e.tile.indexOf(t) >= 0 : (t !== 'camp' && t !== 'shrine')));
  if (!pool.length) pool = EVENTS;
  const fresh = pool.filter(e => G.recent.indexOf(EVENTS.indexOf(e)) < 0);
  const ev = pick(fresh.length ? fresh : pool);
  G.recent.push(EVENTS.indexOf(ev)); if (G.recent.length > 6) G.recent.shift();
  return ev;
}

function genStock(kind) {

  const add = id => { if (ids.indexOf(id) < 0) ids.push(id); };

const tierOf = r => TIERS.slice().reverse().find(t => r >= t.min);

function statLine(p) {

  if (gsum(p, 'roll')) a.push('броски +' + gsum(p, 'roll'));
  if (gsum(p, 'dodge')) a.push('уклонение ' + gsum(p, 'dodge') + '%');
  if (gsum(p, 'crit')) a.push('крит с ' + (20 - gsum(p, 'crit')));

}

function invHTML() {
  const p = P(), sel = G.inv.sel, inCombat = G.phase === 'combat', inVillage = isShop();
  let h = '<div class="modal' + (G.inv.fresh ? ' anim' : '') + '" onclick="invClose()"><div class="sheet" onclick="event.stopPropagation()"><button class="x" onclick="invClose()">✕</button><h2>🎒 Рюкзак · ' + esc(p.name) + '</h2>';
  h += '<h3>Надето</h3><div class="qinv eq">';
  SLOTS.forEach(s => { h += eqSlot(p, s, "invSel('eq','" + s + "')", sel && sel.kind === 'eq' && sel.k === s, 62); });
  h += '</div><div class="small" style="margin:6px 0 10px">' + statLine(p) + ' · 💰 ' + p.gold + '</div>';
  const sets = Object.keys(SETS).filter(sid => setCount(p, sid) >= 1);
  if (sets.length) h += sets.map(sid => setBox(p, sid)).join('');
  h += '<h3 style="margin-top:12px">Рюкзак ' + p.items.length + '/' + BAG + '</h3><div class="bag">';
  for (let i = 0; i < BAG; i++) {
    const id = p.items[i], isSel = sel && sel.kind === 'bag' && sel.k === i;
    h += id ? '<div class="slot full r-' + ITEMS[id].rarity + (isSel ? ' sel' : '') + '" onclick="invSel(\'bag\',' + i + ')">' + ITEMS[id].i + (p.newIds.indexOf(id) >= 0 ? '<span class="nw">NEW</span>' : '') + '</div>' : '<div class="slot"></div>';
  }
  h += '</div>';
  let id = null;
  if (sel) id = sel.kind === 'bag' ? p.items[sel.k] : p.eq[sel.k];
  if (id) {
    const it = ITEMS[id];
    h += '<div class="det"><div style="display:flex;gap:10px;align-items:center"><span style="font-size:36px">' + it.i + '</span><div><b>' + esc(it.n) + '</b><br><span class="tag tc-' + it.rarity + '">' + RAR[it.rarity] + '</span> <span class="small">' + (it.type === 'equip' ? SLOTN[it.slot] : 'Расходник') + '</span></div></div>';
    h += '<div style="margin-top:8px;font-size:14px">' + esc(itemStats(it)) + '</div>' + (it.type === 'equip' && it.d ? '<div class="hint">' + esc(it.d) + '</div>' : '');
    if (it.set) h += setBox(p, it.set);
    if (sel.kind === 'bag') {
      const cbt = CBT_ONLY.indexOf(id) >= 0;
      if (it.type === 'use') h += '<button class="btn grn" onclick="useItem(' + sel.k + ')"' + (cbt && !inCombat ? ' disabled' : '') + '>Использовать' + (cbt && !inCombat ? '<small>только в бою</small>' : '') + '</button>';
      else h += '<button class="btn grn" onclick="equipFrom(' + sel.k + ')"' + (inCombat ? ' disabled' : '') + '>Надеть' + (inCombat ? '<small>нельзя менять снаряжение в бою</small>' : '<small>заменит ' + (p.eq[it.slot] ? esc(ITEMS[p.eq[it.slot]].n) : 'пустой слот') + '</small>') + '</button>';
      if (inVillage) h += '<button class="btn alt" onclick="sellItem(' + sel.k + ')">Продать · ' + sellPrice(id) + ' 💰</button>';
      h += '<button class="btn alt" onclick="dropItem(' + sel.k + ')">Выбросить</button>';
    } else if (sel.k !== 'weapon') h += '<button class="btn alt" onclick="unequip(\'' + sel.k + '\')"' + (inCombat || p.items.length >= BAG ? ' disabled' : '') + '>Снять в рюкзак</button>';
    h += '</div>';
  } else h += '<div class="hint" style="margin-top:12px">Нажми на предмет, чтобы увидеть описание. Новые находки помечены NEW. Снаряжение меняется вне боя. Предметы из одного комплекта усиливают друг друга. В деревне можно продавать лишнее.</div>';
  return h + '<button class="btn alt" onclick="invClose()">Закрыть</button></div></div>';
}

function prologueHTML() {
  const S = STORIES[G.story];
  return '<div class="modal' + (G.prologueFresh ? ' anim' : '') + '"><div class="sheet"><h2>' + S.bi + ' ' + S.n + '</h2><div class="narr big">' + esc(S.pro) + '</div>' +
    '<div class="hint"><b style="color:var(--acc)">Цель:</b> ' + goalHint() + '</div><h3 style="margin-top:12px">Те, кто идёт в путь</h3>' +
    G.players.map(p => '<div class="bgc"><b style="color:' + p.color + '">' + esc(p.name) + '</b> <span class="small">' + bgOf(p).i + ' ' + bgOf(p).n + '</span><div class="small">' + esc(bgOf(p).d) + '</div></div>').join('') +
    '<button class="btn" onclick="closePrologue()">В путь</button></div></div>';
}
function chronHTML() {
  return '<div class="modal' + (G.chronFresh ? ' anim' : '') + '" onclick="closeChron()"><div class="sheet" onclick="event.stopPropagation()"><button class="x" onclick="closeChron()">✕</button><h2>📜 Летопись</h2>' +
    (G.chron.map(c => '<div class="ce"><span>' + (c.r ? 'Круг ' + c.r : 'Пролог') + '</span>' + esc(c.t) + '</div>').join('') || '<div class="hint">Пусто.</div>') + '<button class="btn alt" onclick="closeChron()">Закрыть</button></div></div>';
}
function gameHTML() {
  const p = P();
  let h = '<div id="scene">';
  h += '<div class="topbar"><span class="ttl">ПЕПЕЛЬНЫЕ ЗЕМЛИ</span><button class="ibtn" onclick="openChron()">📜</button><button class="ibtn" onclick="openHelp()">?</button><button class="ibtn" onclick="invOpen()">🎒 ' + p.items.length + (p.newIds.length ? '<span class="dot">' + p.newIds.length + '</span>' : '') + '</button></div>';
  h += objHTML() + omenHTML();
  h += '<div class="strip">' + G.players.map((q2, i) => '<div class="pill' + (i === G.cur ? ' cur' : '') + (q2.out ? ' out' : '') + '"><b style="color:' + q2.color + '">' + esc(q2.name) + '</b><div>❤️ ' + q2.hp + '/' + q2.maxhp + ' 🌑 ' + q2.dark + '</div>' + bar(q2.hp, q2.maxhp, 'hp') + '</div>').join('') + '</div>';
  h += boardHTML();
  h += actionHTML();
  h += '<div class="card" id="hero"><b style="color:' + p.color + '">' + esc(p.name) + '</b> <span class="small">' + RACES[p.race].i + ' ' + RACES[p.race].n + ' · ' + CLASSES[p.cls].i + ' ' + CLASSES[p.cls].n + '</span>';
  h += '<div class="small">Здоровье ' + p.hp + '/' + p.maxhp + ' · защита ' + acOf(p) + (gsum(p, 'dodge') ? ' · уклон ' + gsum(p, 'dodge') + '%' : '') + ' · ' + p.weapon.i + ' ' + p.weapon.n + ' (d' + p.weapon.die + ')' + (p.sharp ? ' · заточка +' + p.sharp : '') + '</div>' + bar(p.hp, p.maxhp, 'hp');
  { const r = repOf(p), tr = tierOf(r), fx = [];
    if (r !== 0) { const mm = Math.round((1 - repMult(p, 'x')) * 100); if (mm) fx.push('цены ' + (mm > 0 ? '−' : '+') + Math.abs(mm) + '%'); }
    if (r >= 3) fx.push('отдых в деревне +2'); if (r >= 5) fx.push('дары селян'); if (r >= 3) fx.push('навыки добра +' + (r >= 7 ? 2 : 1));
    if (r <= -3) fx.push('навыки теней +' + (r <= -7 ? 2 : 1) + ', отдых −2'); if (r <= -5) fx.push('охотники за головами');
    if (r <= -1) fx.push('вор дешевле');
    h += '<div class="small">' + tr.i + ' Репутация: <b>' + tr.n + '</b> (' + (r > 0 ? '+' : '') + r + ')' + (fx.length ? ' · ' + fx.join(', ') : '') + '</div><div class="rbar"><i style="left:' + ((r + 10) / 20 * 100) + '%"></i></div>'; }
  if (p.comp) { const C = compOf(p), l = p.comp.loyal;
    h += '<div class="comp"><span class="ci">' + C.i + '</span><div style="flex:1;min-width:0"><b>' + C.n + '</b> <span class="small">· доверие ' + '❤'.repeat(Math.ceil(l / 2)) + '🤍'.repeat(5 - Math.ceil(l / 2)) + ' ' + l + '/10' + (l >= 5 ? ' · усилен' : '') + '</span><div class="small">' + C.eff + '</div></div><button class="mini" onclick="dismissComp()">' + (G.confirmDismiss ? 'Точно?' : 'Расстаться') + '</button></div>'; }
  h += '<div class="small">Тьма ' + p.dark + '/10' + (p.dark >= 3 ? ' · +1 урона' : '') + (p.dark >= 6 ? ' · шёпот Тьмы ранит' : '') + '</div>' + bar(p.dark, 10, 'dk');
  h += '<div class="small">💰 ' + p.gold + ' · ' + STAT_KEYS.map(k => STATN[k].slice(0, 3) + ' ' + p.stats[k]).join(' · ') + '</div>';
  h += '<div class="small">Навыки: ' + p.skills.map(s => SKILLS[s]).join(', ') + (p.bonus ? ' · к броску +' + p.bonus : '') + (p.rage ? ' · ярость +' + p.rage : '') + (p.guard ? ' · каменная кожа +' + p.guard : '') + '</div></div>';
  h += qinvHTML(p);
  h += '<div class="card"><h3>📜 Летопись героя</h3>' + (G.chron.slice(-2).map(c => '<div class="ce"><span>' + (c.r ? 'Круг ' + c.r : 'Пролог') + '</span>' + esc(c.t) + '</div>').join('') || '<div class="small">История только начинается.</div>') + '<button class="btn alt" onclick="openChron()">Вся летопись</button></div>';
  h += '<div class="card log"><h3>Журнал</h3>' + G.log.slice(-8).reverse().map(l => '<div>' + esc(l) + '</div>').join('') + '</div>';
  h += '</div>';
  if (G.inv.open) h += invHTML();
  if (G.chronOpen) h += chronHTML();
  if (G.prologue) h += prologueHTML(); else if (G.help) h += helpHTML();
  return h;
}

function titlesOf() {
  const t = [];
  const best = (k, name, min) => {
    let bi = -1, bv = 0;
    G.players.forEach((p, i) => { if ((p[k] || 0) > bv && !t[i]) { bv = p[k]; bi = i; } });
    if (bi >= 0 && bv >= min) t[bi] = name + ' (' + bv + ')';
  };
  best('kills', 'Мясник', 1); best('crits', 'Любимец судьбы', 1); best('gold', 'Скряга', 5); best('dark', 'Чёрная душа', 3);
  return t;
}
function endHTML() {
  const T = titlesOf();
  let h = '<div class="big">' + (G.end.win ? '🏆' : '☠️') + '</div><h1>' + (G.end.win ? 'ПОБЕДА' : 'ПОРАЖЕНИЕ') + '</h1><p class="sub">' + G.end.txt + '</p>';
  { const S = STORIES[G.story], ep = G.end.win ? (G.goal === 'boss' ? S.ep.win : GOALS[G.goal].win) : S.ep.lose;
    h += '<div class="narr big">' + esc(ep) + '</div>'; }
  h += '<section><h3>Герои</h3>' + G.players.map((p, i) => '<div class="hero"><div><b style="color:' + p.color + '">' + esc(p.name) + '</b> <span class="tag tc-legendary">' + (T[i] || 'Странник') + '</span><div class="small">' + SLOTS.map(s => p.eq[s]).filter(Boolean).map(id => ITEMS[id].i).join(' ') + ' · убито ' + p.kills + '</div></div><span class="small">❤️ ' + p.hp + ' · 🌑 ' + p.dark + ' · 💰 ' + p.gold + (p.out ? ' · поглощён Тьмой' : '') + ' · ' + tierOf(repOf(p)).i + ' ' + tierOf(repOf(p)).n + '</span></div><div class="fate">' + esc(fmt(bgOf(p)[p.out ? 'dark' : G.end.win ? 'win' : 'lose'], p)) + (p.comp ? ' ' + esc(fmt(compOf(p).end, p)) : '') + '</div>').join('') + '</section>';
  h += '<section><h3>📜 Летопись похода</h3><div class="chronbox">' + (G.chron.map(c => '<div class="ce"><span>' + (c.r ? 'Круг ' + c.r : 'Пролог') + '</span>' + esc(c.t) + '</div>').join('') || '<div class="hint">Пусто.</div>') + '</div></section>';
  h += '<button class="btn" onclick="toLobby()">Новая игра</button>';
  return h;
}

function render() {
  const app = document.getElementById('app');
  const oldSheet = app.querySelector ? app.querySelector('.sheet') : null, keep = oldSheet ? oldSheet.scrollTop : 0;
  app.innerHTML = G.screen === 'lobby' ? lobbyHTML() + (G.help ? helpHTML() : '') : G.screen === 'create' ? createHTML() : G.screen === 'game' ? gameHTML() : endHTML();
  G.moved = false; G.fresh = []; G.cleared = []; G.helpFresh = false; G.chronFresh = false; G.prologueFresh = false; if (G.inv) G.inv.fresh = false;
  if (keep && app.querySelector) { const ns = app.querySelector('.sheet'); if (ns) ns.scrollTop = keep; }
  if (FX_ON) afterRender();
}
render();
initEmbers();
</script>
</html>
